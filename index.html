<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bentax Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andada+Pro:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', sans-serif; color: #333333; background: #ffffff; }

    .prototype-banner {
      background: #c0392b;
      color: #ffffff;
      text-align: center;
      padding: 0.5rem 1rem;
      font-weight: 700;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
    }

    nav {
      background: #103B3D;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
    }

    nav img { height: 40px; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    h1 { font-family: 'Andada Pro', serif; font-size: 3.375rem; color: #103B3D; margin-bottom: 1rem; }
  </style>
</head>
<body>

  <div class="prototype-banner">PROTOTYPE til test — IKKE PRODUKTION</div>

  <nav>
    <img src="assets/img/logo-bentax.svg" alt="Bentax logo">
  </nav>

  <main>
    <h1>Tilmeld dig nyhedsbrev</h1>
    <p>Modtag opdateringer via SMS eller email efter dit valgte interval.</p>

    <form id="signupForm" class="signup-form">
      <div class="form-group">
        <label for="name">Navn *</label>
        <input type="text" id="name" name="name" required>
        <span class="error-message" id="name-error"></span>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
        <span class="error-message" id="email-error"></span>
      </div>

      <div class="form-group">
        <label for="phone">Telefonnummer *</label>
        <input type="tel" id="phone" name="phone" required>
        <span class="error-message" id="phone-error"></span>
      </div>

      <div class="form-group">
        <label for="notificationType">Notifikationstype *</label>
        <select id="notificationType" name="notificationType" required>
          <option value="">Vælg en type</option>
          <option value="sms">SMS</option>
          <option value="email">Email</option>
        </select>
        <span class="error-message" id="notificationType-error"></span>
      </div>

      <fieldset class="form-group radio-group">
        <legend>Frekvens *</legend>
        <div class="radio-option">
          <input type="radio" id="freq14" name="frequency" value="14" required>
          <label for="freq14">Hver 14. dag</label>
        </div>
        <div class="radio-option">
          <input type="radio" id="freq28" name="frequency" value="28" required>
          <label for="freq28">Hver 28. dag</label>
        </div>
        <span class="error-message" id="frequency-error"></span>
      </fieldset>

      <button type="submit" class="submit-btn">Tilmeld mig</button>
    </form>

    <div id="successMessage" class="success-message" style="display: none;">
      <h2>Tilmelding lykkedes!</h2>
      <p>Tak for din tilmelding. Du vil modtage opdateringer snart.</p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="assets/js/form.js" defer></script>
</body>
</html>
