<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bentax Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andada+Pro:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', sans-serif; color: #333333; background: #ffffff; }

    .prototype-banner {
      background: #c0392b;
      color: #ffffff;
      text-align: center;
      padding: 0.5rem 1rem;
      font-weight: 700;
      font-size: 0.875rem;
      letter-spacing: 0.05em;
    }

    nav {
      background: #103B3D;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
    }

    nav img { height: 40px; }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 2rem;
    }

    h1 { font-family: 'Andada Pro', serif; font-size: 3.375rem; color: #103B3D; margin-bottom: 1rem; }
  </style>
</head>
<body>

  <div class="prototype-banner">PROTOTYPE — IKKE PRODUKTION</div>

  <nav>
    <img src="assets/img/logo-bentax.svg" alt="Bentax logo">
  </nav>

  <main>
    <h1>Overskrift</h1>
    <p>Beskriv hvad denne prototype gør.</p>
  </main>

</body>
</html>
